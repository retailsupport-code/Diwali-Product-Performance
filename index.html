<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Diwali'26 Product Performance</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="top">
    <div class="brand">
      <span class="diya" aria-hidden="true">🪔</span>
      <div>
        <h1>Diwali'26 Product Performance</h1>
        <p class="sub">Design-wise Order · Production · Sale · Achievement</p>
      </div>
    </div>
    <div class="top-actions">
      <span id="updated" class="updated">Loading…</span>
      <button id="refreshBtn" class="btn">⟳ Refresh</button>
    </div>
  </header>

  <section class="kpis" id="kpis">
    <div class="kpi"><span>Designs</span><b id="kDesigns">–</b><small id="kVariants"></small></div>
    <div class="kpi"><span>Order Qty</span><b id="kOrder">–</b></div>
    <div class="kpi"><span>Production Qty</span><b id="kInward">–</b><small id="kInwardPct"></small></div>
    <div class="kpi"><span>Sale Qty</span><b id="kSale">–</b></div>
    <div class="kpi gold"><span>Sale Ach %</span><b id="kAch">–</b><small>Sale ÷ Production</small></div>
  </section>

  <section class="filters">
    <input id="search" type="search" placeholder="Search design code / product name…" />
    <select id="catFilter"><option value="">All Categories</option></select>
    <select id="statusFilter">
      <option value="">All Status</option>
      <option value="good">Ach ≥ 30%</option>
      <option value="avg">Ach 10 – 30%</option>
      <option value="low">Ach &lt; 10%</option>
      <option value="pending">No Production</option>
      <option value="partial">Short Production</option>
    </select>
    <select id="sortBy">
      <option value="code">Sort: Design Code</option>
      <option value="achDesc">Sort: Ach % (High → Low)</option>
      <option value="achAsc">Sort: Ach % (Low → High)</option>
      <option value="saleDesc">Sort: Sale Qty (High → Low)</option>
      <option value="orderDesc">Sort: Order Qty (High → Low)</option>
    </select>
    <span id="count" class="count"></span>
  </section>

  <main id="grid" class="grid">
    <div class="state">Loading data from Google Sheet…</div>
  </main>

  <footer class="foot" id="foot"></footer>

  <div id="lightbox" class="lightbox" hidden>
    <button class="lb-close" aria-label="Close">✕</button>
    <img id="lbImg" alt="" />
    <p id="lbCap"></p>
  </div>

  <script src="app.js"></script>
</body>
</html>
